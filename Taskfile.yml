version: '3'

vars:
  BINARY_NAME: bptvnftester
  BUILD_DIR: ./build
  VERSION: '{{.VERSION | default "dev"}}'
  ARCH: '{{.ARCH | default "amd64"}}'
  BUILD_TIME: '{{now | date "2006-01-02T15:04:05Z07:00"}}'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD
  GIT_BRANCH:
    sh: git rev-parse --abbrev-ref HEAD
  LDFLAGS: "-linkmode external -extldflags \"-static\" -w -s -X main.AppName={{.BINARY_NAME}} -X main.AppVersion={{.VERSION}} -X main.BuildTime={{.BUILD_TIME}} -X main.GitCommit={{.GIT_COMMIT}} -X main.GitBranch={{.GIT_BRANCH}}"
  GOFLAGS: '{{.GOFLAGS | default ""}}'

tasks:
  build-all:
    desc: Rebuild all packages
    cmds:
      - task: build
        vars:
          GOFLAGS: '-a'
          BUILDALL: 'all'

  build:
    desc: Build the application for Linux AMD64
    summary: |
      Build the Go application for Linux AMD64 architecture.
      Usage: task build [VERSION_TAG=v1.0.0] (defaults to "dev")
      Includes version, build time, git commit, and branch info.
    platforms: [windows, linux, darwin]
    cmds:
      - task: ensure-build-dir
      - task: go-build-linux
        vars:
          GOFLAGS: '{{.GOFLAGS}}'
          BUILDALL: '{{.BUILDALL | default ""}}'

  go-build-linux:
    internal: true
    platforms: [windows, linux, darwin]
    silent: true
    vars:
      GOOS: linux
      GOARCH: '{{.ARCH}}'
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
    cmds:
      - echo "Building {{.BUILDALL}} {{.BINARY_NAME}} for {{.GOOS}}/{{.GOARCH}}"
      - cmd: go build {{.GOFLAGS}} -tags "netgo osusergo" -ldflags="{{.LDFLAGS}}" -o "{{.BUILD_DIR}}/{{.BINARY_NAME}}-{{.GOOS}}-{{.GOARCH}}"
      - cmd: upx --best --lzma "{{.BUILD_DIR}}/{{.BINARY_NAME}}-{{.GOOS}}-{{.GOARCH}}"
        silent: true
      - 'echo "Built {{.BINARY_NAME}}-linux-amd64 ({{.VERSION}}, {{.GIT_COMMIT}}, {{.BUILD_TIME}})"'

  ensure-build-dir:
    internal: true
    platforms: [windows, linux, darwin]
    silent: true
    cmds:
      - cmd: powershell -Command "New-Item -ItemType Directory -Force -Path '{{.BUILD_DIR}}' | Out-Null"
        platforms: [windows]
      - cmd: mkdir -p {{.BUILD_DIR}}
        platforms: [linux, darwin]

  info:
    desc: Show build information
    silent: true
    cmds:
      - 'echo "Version: {{.VERSION}}"'
      - 'echo "Build Time: {{.BUILD_TIME}}"'
      - 'echo "Git Commit: {{.GIT_COMMIT}}"'
      - 'echo "Git Branch: {{.GIT_BRANCH}}"'
      - 'echo "LDFLAGS: {{.LDFLAGS}}"'

  clean:
    desc: Clean build artifacts
    cmds:
      - cmd: rm -rf {{.BUILD_DIR}}
        platforms: [linux, darwin]
      - cmd: powershell -Command "Remove-Item -Recurse -Force -Path '{{.BUILD_DIR}}' | Out-Null"
        platforms: [windows]

  default:
    desc: Show available tasks
    cmds:
      - task --list